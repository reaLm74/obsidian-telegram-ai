name: Release Obsidian plugin

on:
    pull_request_target:
        types:
            - closed
        branches:
            - main

permissions:
    contents: write
    pull-requests: write
    # Required to mint a build-provenance attestation for the release assets.
    id-token: write
    attestations: write

jobs:
    release:
        if: ${{ github.event.pull_request.merged == true && github.head_ref == 'develop' && github.event.pull_request.author_association == 'OWNER' }}
        runs-on: ubuntu-latest
        steps:
            - name: Print github
              run: echo '${{ toJson(github) }}'

            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22.x"

            - name: Build plugin main.js
              id: build_plugin
              run: |
                  git config core.autocrlf false
                  git config core.eol lf
                  npm ci
                  npm run build

                  TAG_NAME=$(node -p "require('./package.json').version")
                  echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

            # Signs a statement that these exact files were built by this workflow from this
            # repository, so anyone downloading a release can verify with `gh attestation
            # verify` that the assets match the source rather than trusting the upload.
            - name: Attest build provenance
              uses: actions/attest-build-provenance@v2
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      styles.css

            - name: Create release
              uses: softprops/action-gh-release@v3
              with:
                  files: |
                      main.js
                      manifest.json
                      styles.css
                  token: ${{ secrets.GITHUB_TOKEN }}
                  tag_name: ${{ env.TAG_NAME }}
                  name: ${{ env.TAG_NAME }}
                  generate_release_notes: true
                  prerelease: false
                  draft: false

            - name: Create and merge pull request from main to develop
              run: |
                  gh pr create -B develop -H main --title 'Merge main into develop' --body 'Merge main into develop'
                  gh pr merge --merge --body 'Merge main into develop'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
